        - paragraph [ref=f19e83]: S3 · HOJA DE ESPECIFICACIONES
        - paragraph [ref=f19e84]: MÉTODO · 04 PASOS
      - heading "Método" [level=2] [ref=f19e85]
      - paragraph [ref=f19e86]: Cuatro pasos, en este orden. Sin reunión inicial, sin presupuesto previo y sin brief. El riesgo lo asume el estudio hasta el paso 04.
      - list [ref=f19e87]:
        - listitem [ref=f19e88]:
          - text: "01"
          - heading "Se elige el negocio" [level=3] [ref=f19e89]
          - paragraph [ref=f19e90]: Un negocio de Albacete que trabaja bien y se presenta mal. Lo elegimos nosotros. No hay llamada previa ni formulario que rellenar.
        - listitem [ref=f19e91]:
          - text: "02"
          - heading "Se construye la página entera" [level=3] [ref=f19e92]
          - paragraph [ref=f19e93]: "Diseño, textos y desarrollo completos. No es un mockup ni una plantilla con su logotipo: es la web terminada, con su nombre, sus servicios y sus fotos, ya desplegada en una dirección real."
        - listitem [ref=f19e94]:
          - text: "03"
          - heading "Se enseña en persona, en el móvil" [level=3] [ref=f19e95]
          - paragraph [ref=f19e96]: Vamos al local sin avisar de nada más. Se abre en su teléfono, se recorre entera y se responden las dudas ahí mismo. Diez minutos.
        - listitem [ref=f19e97]:
          - text: "04"
          - heading "Se decide" [level=3] [ref=f19e98]
          - paragraph [ref=f19e99]: "Si la quiere, se paga y se le transfiere todo: código, dominio y accesos. Si no la quiere, se apaga el mismo día y no se vuelve a mencionar."
